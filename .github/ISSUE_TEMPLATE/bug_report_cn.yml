name: 🙋‍♂️ [RegexMate] - 支持与反馈
description: "获取有关 RegexMate、报告错误或请求功能的帮助。"
title: '🙋‍♂️ 支持与反馈: RegexMate'
labels: ['support', 'feedback', 'question']
assignees:
  - jaywcjlove

body:
  - type: markdown
    attributes:
      value: |
        <img align="right" height="100" alt="RegexMate" src="https://wangchujiang.com/regex-mate/assets/logo.png" /> 请提供有关您的支持请求或反馈的尽可能详细的信息。
        
        一款正则表达式应用程序，支持 macOS 和 iOS 平台。它拥有简洁的用户界面和强大的功能，能够帮助用户轻松地创建、测试和使用正则表达式。

        ### 联系信息

        如果您在使用我们的应用时遇到任何问题或需要支持，请随时通过以下方式与我们联系：

        - **电子邮件支持**: [kennyiseeyou@gmail.com](mailto:kennyiseeyou@gmail.com)
        - **社交媒体**: [Twitter](https://twitter.com/jaywcjlove)

        我们会尽快回复您的消息，感谢您对我们应用的支持！


  - type: textarea
    attributes:
      label: 🙋‍♂️ 您需要什么帮助？
      description: 描述您面临的问题或您想要请求的功能。
      placeholder: 例如，我遇到了问题...
    validations:
      required: true

  - type: dropdown
    id: os_version
    attributes:
      label: "💻 操作系统"
      description: "请选择你正在使用的操作系统及版本。"
      options:
        - macOS 27.x (Tahoe)
        - macOS 26.x (Tahoe)
        - macOS 15.x (Sequoia)
        - macOS 14.x (Sonoma)
        - macOS 13.x (Ventura)
        - macOS 12.x (Monterey)
        - iOS 26.x
        - iOS 18.x
        - iOS 17.x
        - iPadOS 26.x
        - iPadOS 18.x
        - iPadOS 17.x
        - 其他
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        **如何向我发送应用程序的崩溃报告？**

        - 在 macOS 上打开 Finder
        - 从“前往”菜单中选择 **前往文件夹…** <kbd>⇧</kbd> + <kbd>⌘</kbd> + <kbd>G</kbd>
        - 输入：**~/Library/Logs/DiagnosticReports**
        - 在出现的列表中，选择所有以应用程序名称开头的文件，将它们压缩成 ZIP 文件并发送给我
        - 将文件附加到此问题中

  - type: textarea
    attributes:
      label: ℹ️ 补充说明
      description: 在此添加有关问题的其他上下文信息。
      placeholder: 例如：截图、复现步骤等。
    validations:
      required: false